[project]
authors = [{name = "serranolio", email = "serranolio@gmail.com"}]
dependencies = []
name = "sgp"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[tool.pixi.pypi-dependencies]
sgp = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
matplotlib = ">=3.10.7,<4"
scipy = ">=1.16.2,<2"
ipython = ">=9.6.0,<10"
pytest = ">=8.4.2,<9"
pytest-cov = ">=7.0.0,<8"
mystmd = ">=1.6.3,<2"
notebook = ">=7.4.7,<8"
tqdm = ">=4.67.1,<5"
